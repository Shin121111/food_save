server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:good_store}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.sql.init.mode=always
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
# Local-only settings (MySQL password), written by start.cmd. Git ignores the file.
spring.config.import=optional:file:local.properties
